services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "PON TU CONTRASEÑA AQUIIII"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: void_zoo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
